name: Streamlit app checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: streamlit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
      - run: |
          git lfs install --local
          git lfs pull --include="$(cat models/lfs-paths.txt)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            ui/requirements.txt
            deployment/requirements-test.txt
      - run: python -m pip install -r ui/requirements.txt -r deployment/requirements-test.txt
      - run: python -m pip check
      - run: python -m pytest -q tests/test_public_app.py
      - run: python tools/check_public_demo.py --report public-check.json
