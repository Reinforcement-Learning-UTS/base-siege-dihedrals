name: Base Siege checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: base-siege-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
      - name: Fetch approved final checkpoints
        run: |
          git lfs install --local
          git lfs pull --include="$(cat models/lfs-paths.txt)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            ui/requirements.txt
            deployment/requirements-test.txt
            deployment/requirements-project-test.txt
      - run: python -m pip install -r ui/requirements.txt -r deployment/requirements-project-test.txt
      - run: python -m pip check
      - run: mkdir -p local-output
      - name: Research, recovery and application regressions
        run: >-
          python -m pytest -q tests trpo ddqn_experiment ddqn_final_benchmark version2
          v2_cohort_evaluation v2_development v2_final v2_phases v2_replays
          v2_replication v3_final v3_probe --junitxml=local-output/research.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: research-validation
          path: |
            local-output/*.xml
            local-output/*.json
            local-output/*.zip
            local-output/streamlit-app/public-check.json
          retention-days: 7
          if-no-files-found: warn
  cpu-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
      - name: Fetch approved final checkpoints
        run: |
          git lfs install --local
          git lfs pull --include="$(cat models/lfs-paths.txt)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            ui/requirements.txt
            deployment/requirements-test.txt
            deployment/requirements-project-test.txt
      - run: python -m pip install -r ui/requirements.txt -r deployment/requirements-project-test.txt
      - run: python -m pip check
      - run: mkdir -p local-output
      - name: CPU application regressions
        run: >-
          python -m pytest -q tests/test_public_app.py tests/test_ui.py
          tests/test_manual_custom_ui.py tests/test_browser_manual_parity.py
          tests/test_policy_playback.py tests/test_visual_replay.py
          tests/test_v2_application.py tests/test_ddqn_application.py
          tests/test_trpo_application.py tests/test_three_method_application.py
          tests/test_prototype_parity.py tests/test_deployment.py
          --junitxml=local-output/application.xml
      - name: Verify all final models
        run: python tools/check_demo_models.py --out local-output/final-models.json
      - name: Build standalone deployment source
        run: python tools/build_deploy_bundle.py --out local-output/streamlit-app
      - name: Check independent deployment bundle
        working-directory: local-output/streamlit-app
        run: |
          python -m pytest -q tests/test_public_app.py
          python tools/check_public_demo.py --report public-check.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: cpu-app-validation
          path: |
            local-output/*.xml
            local-output/*.json
            local-output/*.zip
            local-output/streamlit-app/public-check.json
          retention-days: 7
          if-no-files-found: warn
